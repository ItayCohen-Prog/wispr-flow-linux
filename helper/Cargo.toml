[package]
name = "wispr-flow-linux-helper"
version = "0.1.3-flowfix.3"
edition = "2021"
description = "Clean-room Linux helper for Wispr Flow: speaks the helper IPC contract over stdin (commands) / fd 3 (events) and backs the OS-integration commands on Hyprland (Wayland: uinput + ext-data-control + AT-SPI)."
license = "Unlicense"

# Produces a single binary `wispr-flow-linux-helper` that drops into the app's
# resources dir, mirroring the shipped macOS/Windows helpers. The Electron
# main-process helper-path resolver needs a `'linux'` branch pointing at it
# (see docs/reference/ipc-contract.md §8).
[[bin]]
name = "wispr-flow-linux-helper"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# Raw uinput ioctls for the in-process virtual keyboard (backend::uinput) and
# evdev ioctls for key capture (capture::evdev).
libc = "0.2"
# Logging to stderr (fd 2 is the diagnostic channel; fd 1/stdout is non-IPC).
log = "0.4"
env_logger = "0.11"
# D-Bus (pure-Rust, no libdbus): used directly by the AT-SPI modules for proxy
# construction and the a11y-bus PID lookup. Must stay on the same 4.x line as
# the `atspi` crate below so there is a single zbus in the tree.
zbus = "4"
# In-process Wayland clipboard owner (backend::wl_clipboard): offer text/plain +
# text/html simultaneously via the focus-free ext-data-control protocol, instead
# of shelling out to wl-copy (which can only serve one payload). Pure-Rust.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["staging", "client"] }

# AT-SPI2 (backend::atspi_app, backend::atspi_sel): active-app identity + focus
# events, and the non-destructive path for GetSelectedTextViaCopy (query the
# focused accessible's Text interface instead of synthesizing Ctrl+C).
# Pure-Rust (zbus); 0.22 pins zbus 4. The `tokio` feature is mandatory (atspi
# requires an async runtime); we drive it from a tiny per-call current-thread
# runtime, so only `rt` + `time` are needed.
atspi = { version = "0.22", default-features = false, features = ["proxies", "connection", "tokio"] }
tokio = { version = "1", features = ["rt", "time"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
